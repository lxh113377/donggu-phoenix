name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 门禁独立成 job：判红就不部署，避免把坏版本推上线。
  # 此前只有 deploy 一个 job，且步骤里只有 test -f 存在性检查，
  # 仓库里已有的 tools/verify_site.py 从未被 CI 执行过（11 次全绿的真实含义是「11 次没检查」）。
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # node 是 tools/js_syntax_test.py 的硬依赖。该判据找不到 node 时
      # 故意判 FAIL 而非 SKIP —— SKIP 会让「判据没跑」伪装成「判据通过」
      #（轮96 修的正是这个病：main.js 语法坏、页面全不渲染，CI 却全绿）。
      # 所以必须显式保证 runner 有 node，不依赖 ubuntu 镜像预装。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # chrome + websocket-client 是 tools/visual_balance_test.py（CDP 版）的依赖。
      # 该判据缺 chrome 时返回 SKIP 而非 FAIL —— 它的正确性已由本地三连跑证明
      # （桌面/平板/手机极差 0.7/0.8/0.3），CI 只是持续防护；
      # 若为装工具而判红会造成「工具噪音」压过真问题。
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: echo "chrome=${{ steps.setup-chrome.outputs.chrome-path }}"
      - run: python -m pip install --quiet websocket-client

      # numpy/opencv 是 tools/verify_pixel_exact.py（像素级判据）的硬依赖。
      # 一手教训：曾只装 Pillow，该脚本在 import 期就崩，父门禁把「缺依赖」
      # 误读成「判据未通过」—— 依赖清单必须与判据脚本同步升级。
      # qrcode 是轮88 新增的 tools/reverse_probe_qr_gate.py 的硬依赖（经 tools/make_qr.py
      # 生成「能正常解码但内容错误」的码，才能证明判据真的读了像素）。
      # 我又踩了一次上面那条注释写的同一个坑：本机装了 qrcode 所以本地 7 道全绿，
      # CI 干净环境 ModuleNotFoundError 判红（run 39589515658）。
      # 教训固化：**加判据的当轮必须同时核对依赖清单**，本地绿不构成证据。
      - name: Install image tooling (generators, icon checks, pixel-fidelity gate)
        run: python -m pip install --quiet Pillow numpy opencv-python-headless fonttools brotli qrcode

      # 这一步在 CI 里比在本地更有判定力：checkout 产出的工作区恰好等于「将要部署的内容」，
      # 所以 verify_site.py 的 git 跟踪面对账会真实抓到「页面引用了未提交的文件」——
      # 本地跑时那些文件在磁盘上存在，反而可能漏判。
      # 注：曾在此加一步 git status --porcelain 断言工作区干净，但 CI checkout 后必然干净，
      # 那是个恒不失败的假步骤，已删除。
      - name: Verify site integrity
        run: python tools/verify_site.py

      # JS 语法判据（轮96 新增，紧接 verify_site 之后 —— 语法错要最早暴露）。
      # 起因：我把 main.js 改出 SyntaxError，页面数据全不渲染，而当时 36 条判据全绿：
      # verify_site 只查文件存在性与引用完整性、不解析 JS；浏览器判据读不到数据时
      # 按设计返回 SKIP（避免环境问题误判产品），于是「页面坏」和「环境不可用」
      # 在结果里长得一样。这条纯静态判据堵住这个缝，扫描面含 site/ 与 functions/。
      - name: JS syntax check (site + cloud functions)
        run: |
          python tools/js_syntax_test.py
          python tools/reverse_js_syntax.py

      # 设计审计的静态半部（无需浏览器）：:active 按下态 / 行长单位 / 无 UI 框架 /
      # 无外链字体 / 无 AI 标配紫。这五项都是历史真缺陷的机器化判据。
      - name: Design static audit
        run: python tools/ci_design_static.py

      # 首屏构图平衡（CDP 版，等 Phoenix 组装完成后截图）。
      # 轮99 曾因 --screenshot 等不到事件而禁用（手机极差 31.4），
      # 轮101 换 CDP 后极差降到 0.7/0.8/0.3，故重新接入。
      # 缺 chrome 时 SKIP（环境问题），构图失衡才 FAIL。
      - name: Visual balance (CDP)
        run: python tools/visual_balance_test.py

      # AR 核心功能端到端（轮108）。旧版依赖 agent-browser，
      # 而其二进制在本机根本不存在，脚本只 print 不判定、退出码恒 0 ——
      # 等于本站核心功能从未被验证过（本地与 CI 都看不出）。
      # 重写为 CDP 版：三段场景各自验「时间推进 + canvas 写入 + fps + 落章」，
      # 并做数据/注册表对账。反向验证 4 用例证明三种真故障都能判红。
      # 缺 chrome 时 SKIP（环境问题），AR 真坏才 FAIL。
      - name: AR playback (core function, CDP)
        run: python tools/ar_playback_test.py


      # 轮124：浏览器套件全量接入（此前 27 条中只有 5 条挂 CI，其余 22 条从未在 CI 跑过）。
      # 背景：轮117 发现「--status 报 27/27 全绿但实际 12 条从未有读数」；
      # 轮118-123 逐条迁移到 CDP 后 27 条都能真跑，但「本机能跑」不等于「CI 有守护」——
      # 若只在本机跑，改动破坏某维度时 CI 不会红，问题要等人工发现。
      #
      # 本机实测 22 条合计 424 秒（7.1 分钟）。下列 17 条合计约 5 分钟，全部自足
      # （自起 SiteServer + 自起 chrome，零公网、零 wrangler、零 D1）。
      # 未接入的 5 条及原因：
      #   offline_live_test / preflight_device_test  —— 需公网（断网复验、线上两面）
      #   admin_contrast_test / admin_responsive_test —— 需 wrangler pages dev + D1
      #   reverse_ar_playback —— 118 秒（起 4 次 chrome），代价过高，留本地套件
      #
      # 缺 chrome 时各自 SKIP（环境问题），真坏才 FAIL。
      - name: Browser suite (17 CDP gates)
        run: |
          # 9 视口无横向溢出/越界/首屏裁切
          python tools/multi_viewport_test.py
          # 手机首屏锁一屏
          python tools/hero_height_test.py
          # 装饰环在画布内
          python tools/ring_containment_test.py
          # 进场元素全部触发（22 个）
          python tools/reveal_coverage_test.py
          # 跳转后进场不失效（8 段）
          python tools/reveal_after_jump_test.py
          # 锚点未被顶栏遮住（8 个）
          python tools/anchor_offset_test.py
          # 2 种缩放等效视口无溢出/越界/字号可读
          python tools/zoom_test.py
          # 4 视口触控目标 >= 44px
          python tools/touch_target_test.py
          # 2 视口文本对比度全部达标
          python tools/contrast_audit.py
          # 轮125：后台这两条原需 wrangler pages dev + D1（Win 上靠 npx），
          # 但后台已于轮109 静态化 —— 注释里自己写着「不再需要 wrangler」。
          # 改为进程内 SiteServer 后，零 npx/零 D1/零公网，故可进 CI。
          # 覆盖：后台 2 视口 453 处对比度 + 4 视口 8 个触控目标。
          python tools/admin_contrast_test.py
          python tools/admin_responsive_test.py
          # 85 张图无变形/模糊/加载失败
          python tools/image_quality_test.py
          # AR 核心功能 7 项
          python tools/ar_e2e_test.py
          # AR 三场景切换 + 集章
          python tools/ar_scenes_test.py
          # 集章生效 + 持久化 + 防重复
          python tools/ar_stamp_test.py
          # AR 焦点闭环 7 项（a11y）
          python tools/ar_focus_test.py
          # defer 后功能回归 5 项
          python tools/defer_regression_test.py
          # 运行时健康（无泄漏/累积/叠加）
          python tools/runtime_health_test.py
          # 引擎行为（密度自适应 + HUD 节流）
          python tools/engine_behavior_test.py
      # 守卫自身的自检：保证「零样本必 SKIP」不会被悄悄改坏。
      # 数据字段消费者检查也放这里（纯静态、无浏览器依赖）。
      - name: Guard self-test
        run: |
          python tools/gate_guard.py
          python tools/dead_data_test.py
          python tools/prove_no_visual_change.py
          python tools/rhythm_test.py
          python tools/stagger_test.py
          python tools/reduced_motion_test.py
          python tools/microinteraction_test.py
          python tools/safe_script_test.py
          python tools/critical_path_test.py
          python tools/browser_test_lint.py
          python tools/cjk_typography_test.py
          python tools/cjk_latin_spacing_test.py
          python tools/cjk_punctuation_test.py
          python tools/resilience_test.py
          python tools/social_meta_test.py
          python tools/bilingual_parity_test.py
          python tools/originality_audit.py
          python tools/orphan_asset_test.py
          python tools/narration_gate_test.py
          python tools/engine_polish_test.py
          python tools/dead_definition_test.py
          python tools/dead_css_decl_test.py
          python tools/reverse_dead_css.py
          python tools/reverse_cjk_scope.py
          python tools/reverse_design_merch_pct.py
          python tools/tracking_center_test.py
          python tools/secret_leak_test.py
          python tools/admin_colspan_test.py
          python tools/reverse_admin_colspan.py
          # 轮127（U-401）：后台 canvas 绘制色必须等于 :root 里的 CSS 令牌。
          # 这条不变量是代码注释自己声明的（「canvas 内文字 getComputedStyle 读不到，
          # 对比度判据覆盖不到，颜色须手工对齐」）—— 声明了却没人守，
          # 与 U-395「memory 4KB 硬限没人守」同族。
          # 漂移路径很现实：有人为对比度调亮 --gold，忘了同步 canvas 里的
          # '#D4A24E' -> 图与卡片配色分叉，肉眼很难发现，且现有判据全绿。
          # 自带两项尺子自检：canvas 乱用非令牌色、只改令牌不改图，都要被抓到。
          python tools/admin_canvas_tokens_test.py

          # 轮109（2026-10-22，老大报的「数据突然跌下去」）：后台与页脚改为静态演示样本。
          # 这条守住决定本身：数据漂移、口径越界、求和不自洽，
          # 以及最容易被顺手改回去的「退回实时读接口 / 加定时器」。
          python tools/admin_static_data_test.py
          # 上一条只读源码，证明不了「页面真的把数字画出来了」（轮17/52：函数存在 != 行为发生）。
          # 静态页零接口，所以这里只需进程内静态服务，不再需要 wrangler pages dev。
          python tools/admin_static_render_test.py
          # 轮112：上面那条走 HTTP、测的是正向路径（数据在、渲染对、刷新不变）。
          # 本条补静态化另两条承诺：file:// 双击可看（重写的主要动机之一，
          # HTTP 下抓不到「相对路径在 file:// 解析失败」）、
          # 以及样本缺失时有明确空态（render_test 假设数据在，兜底行为没人守）。
          # 自带两项尺子自检：删掉判空兜底、数据退回 fetch，都必须被抓到。
          python tools/admin_static_fallback_test.py
          # 反向验证：造 7 类数据退化 + 2 类渲染退化，证明上面两条真有牙
          # （本仓已 5 次遇到「只会报 PASS 的判据」）。故与主判据同挂 CI。
          python tools/reverse_admin_static.py
          python tools/ledger_id_test.py
          # 轮125（U-395~397）：memory/ 的 4KB 硬限此前**没有任何机器检查**，
          # 结果实测 6 个文件超限、最大 263KB —— 规则写着没人守就会一路漂移。
          # 棘轮式：存量超限记入基线（不判红，因拆分需与并行端协调），
          # 但禁止继续变大；基线建立后新增的超限文件直接 FAIL；
          # 谁把它拆小，基线自动收紧。反向验证 5 类情形全部按预期。
          python tools/memory_size_test.py
          python tools/reverse_memory_size.py
          # 轮74：环境缺口归因的反向验证。CI 上 C1（classify_child 单测）跑，
          # C2-C5 因无本机 LibreOffice 故障现场而显式 SKIP —— SKIP 不等于通过。
          python tools/reverse_env_attribution.py
          # 轮85（U-02）：打样包规格必须与 culture.js 同源 —— 工厂按 A 做、观众看 B
          # 是最难发现的交付事故，故把对账做成 CI 判据（只读，不生成 PDF）。
          python tools/make_proof_pack.py --check
          # 轮85（U-02）：实拍替换流水线的反向验证。它会在沙箱副本上跑，
          # 含「门禁判红必须逐字回滚」这条 —— 不造红就永远不知道回滚是真是假。
          python tools/reverse_replace_merch_photo.py
          # 轮85/88（U-01）：真机自检入口码判据的反向验证。用例 C 换成「能正常解码
          # 但内容错误」的码，证明 7b 真的读了像素，而不是只看文件在不在。
          python tools/reverse_probe_qr_gate.py

  deploy:
    name: Deploy
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify site before publish
        run: |
          set -e
          test -f site/index.html
          test -f site/assets/img/qr.png
          test -f site/assets/css/main.css
          test -f site/assets/js/phoenix.js
          grep -q "畲" site/index.html
          echo "site files: $(find site -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
